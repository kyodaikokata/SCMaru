<!doctype html>
<html><head><meta charset="utf-8"><title>SCMaru Overlay</title><link rel="stylesheet" href="/fonts.css?v=__SCMARU_REVISION__">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
#line{font:600 36px sans-serif;color:white;white-space:pre-wrap;text-align:center;line-height:1.3;overflow-wrap:anywhere;max-width:100%}
#state{position:fixed;bottom:8px;left:0;right:0;font:14px sans-serif;color:#b98a16;text-align:center}
body.preview{background-color:#38343e;background-image:linear-gradient(45deg,#48424e 25%,transparent 25%),linear-gradient(-45deg,#48424e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#48424e 75%),linear-gradient(-45deg,transparent 75%,#48424e 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
</style></head><body><div id="center"><div id="line"></div></div><div id="state"></div>
<script>
if(location.pathname==='/preview')document.body.classList.add('preview');
let stamp=Date.now();
const revision='__SCMARU_REVISION__';
function rgba(hex,alpha){if(!/^#[0-9a-f]{6}$/i.test(hex))hex='#000000';return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${alpha})`;}
function render(s){const line=document.querySelector('#line');line.textContent=s.text;line.style.fontSize=s.size+'px';
line.style.color=s.color;line.style.fontWeight=s.bold_enabled?Math.max(700,s.weight):s.weight;
line.style.fontStyle=s.italic_enabled?'italic':'normal';
line.style.webkitTextStroke=s.stroke_enabled?`${s.stroke_width}px ${s.stroke_color}`:'0px transparent';
line.style.paintOrder='stroke fill';
line.style.fontFamily=JSON.stringify(s.font)+',"Microsoft YaHei UI","Yu Gothic UI",sans-serif';
const shadows=[];
if(s.shadow_enabled)shadows.push(`${s.shadow_offset}px ${s.shadow_offset}px ${s.shadow_blur}px ${rgba(s.shadow_color,s.shadow_opacity)}`);
if(s.glow_enabled){shadows.push(`0 0 ${s.glow_blur}px ${rgba(s.glow_color,s.glow_opacity)}`);shadows.push(`0 0 ${s.glow_blur*2}px ${rgba(s.glow_color,s.glow_opacity/2)}`);}
line.style.textShadow=shadows.length?shadows.join(','):'none';document.querySelector('#state').textContent=s.connected?'':s.offline;}
async function tick(){try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();
if(s.revision&&s.revision!==revision){const url=new URL(location.href);url.searchParams.set('v',s.revision);location.replace(url.href);return;}
render(s);stamp=Date.now();}
catch(e){if(Date.now()-stamp>5000)document.querySelector('#state').textContent='SCMaru offline';}}
tick();setInterval(tick,500);
</script></body></html>
